/* 허브 틀 — 색·글꼴·카드는 성적노트 토큰(app.css :root)을 그대로 씀 */
html,body{height:100%}
body.hub{margin:0;display:flex;flex-direction:column;height:100dvh;background:var(--bg);color:var(--ink);font-family:var(--f-body)}
.hub .devbar{flex:none}
.hub-top{flex:none;display:flex;align-items:center;gap:10px;padding:8px 14px;padding-top:max(8px,env(safe-area-inset-top));background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);border-bottom:1px solid var(--line2);z-index:5}
.hub-brand{display:flex;align-items:center;gap:8px;font-family:var(--f-round);font-weight:800;font-size:17px;color:var(--ink);text-decoration:none;white-space:nowrap}
.hub-brand svg{width:30px;height:30px}
.hub-who{font-size:13px;color:var(--muted);white-space:nowrap;max-width:30vw;overflow:hidden;text-overflow:ellipsis}
.hub-tabs{margin-left:auto;display:flex;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;box-shadow:var(--shadow)}
.hub-tab{position:relative;display:flex;align-items:center;gap:6px;border:0;background:none;color:var(--muted);font:600 14px var(--f-body);padding:5px 12px 5px 8px;border-radius:999px;cursor:pointer;white-space:nowrap}
.hub-tab svg{width:24px;height:24px;flex:none}
.hub-tab[aria-selected="true"]{background:var(--blue);color:#fff;box-shadow:0 3px 10px rgba(91,75,240,.3)}
.hub-tab .bd{position:absolute;right:2px;top:-3px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font:700 11px/18px var(--f-body);text-align:center}
.hub-out{border:0;background:none;color:var(--muted);font:600 13px var(--f-body);padding:8px 8px;border-radius:10px;cursor:pointer}
.hub-out:hover{background:var(--fill)}
.hub-body{flex:1;min-height:0;position:relative}
.hub-frame{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
.hub-frame[hidden]{display:none}
.hub-pane{position:absolute;inset:0;overflow:auto;-webkit-overflow-scrolling:touch}
.hub-pane[hidden]{display:none}
.hub-soon{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--muted);text-align:center;padding:24px}
.hub-soon b{font-family:var(--f-round);font-size:20px;color:var(--ink)}
/* 아래 탭바(모바일) — 토스처럼 아이콘 + 짧은 글자 */
.hub-bar{flex:none;display:none;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line2);padding:4px 6px calc(4px + env(safe-area-inset-bottom));z-index:5}
.hub-bar .hub-tab{flex:1;flex-direction:column;gap:1px;padding:5px 2px 4px;border-radius:14px;font-size:11.5px;background:none;box-shadow:none;color:var(--faint)}
.hub-bar .hub-tab svg{width:30px;height:30px}
.hub-bar .hub-tab[aria-selected="true"]{background:var(--blue-soft);color:var(--blue-ink);box-shadow:none}
.hub-bar .hub-tab .bd{right:calc(50% - 26px)}
@media (max-width:760px){.hub-tabs{display:none}.hub-bar{display:flex}.hub-who{display:none}.hub-top{padding-bottom:6px}.hub-out{margin-left:auto}}
@media (min-width:761px){.hub-brand svg{width:34px;height:34px}}
/* 로그인 */
.hub-login{height:100%;overflow:auto;display:flex;flex-direction:column;align-items:center;padding:28px 18px 40px}
.hub-hero{position:relative;width:min(340px,86vw);height:190px;margin:4px 0 6px}
.hub-hero .m{position:absolute;filter:drop-shadow(0 14px 18px rgba(59,47,201,.16))}
.hub-hero .m1{width:150px;left:10px;top:18px;animation:hubFloat 4.6s ease-in-out infinite}
.hub-hero .m2{width:132px;right:6px;top:36px;animation:hubFloat 5.4s ease-in-out -1.8s infinite}
.hub-hero .m3{width:58px;left:150px;top:2px;animation:hubFloat 3.8s ease-in-out -.8s infinite}
@keyframes hubFloat{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-9px) rotate(2deg)}}
@media (prefers-reduced-motion:reduce){.hub-hero .m{animation:none}}
.hub-card{width:min(400px,100%);background:var(--surface);border-radius:var(--r-card);box-shadow:var(--shadow);padding:22px 20px 20px;border:1px solid var(--line2)}
.hub-card h1{margin:0 0 4px;font-family:var(--f-round);font-size:24px;font-weight:800;letter-spacing:-.01em}
.hub-card p{margin:0 0 16px;color:var(--muted);font-size:14.5px;line-height:1.5}
.hub-field{width:100%;box-sizing:border-box;border:2px solid var(--line);background:var(--bg);border-radius:var(--r-ctl);padding:15px 16px;font:700 22px var(--f-mono);letter-spacing:.12em;text-align:center;color:var(--ink);text-transform:uppercase}
.hub-field.pw{text-transform:none;letter-spacing:.04em;font-size:18px}
.hub-field:focus{outline:0;border-color:var(--blue);background:var(--surface)}
.hub-go{width:100%;margin-top:12px;border:0;border-radius:var(--r-ctl);padding:15px;background:var(--btn);color:#fff;font:700 17px var(--f-body);box-shadow:var(--btn-shadow);cursor:pointer}
.hub-go:disabled{opacity:.55;cursor:default}
.hub-go:active{transform:translateY(1px)}
.hub-rem{display:flex;align-items:center;gap:8px;margin-top:12px;color:var(--muted);font-size:14px}
.hub-err{min-height:20px;margin-top:10px;color:var(--red);font-size:14px;font-weight:600;text-align:center}
.hub-foot{margin-top:18px;color:var(--faint);font-size:12px;display:flex;align-items:center;gap:6px}
.hub-foot svg{width:16px;height:16px}
</style>

<script>
(function () {
  var $ = function (s) { return document.querySelector(s); };
  var V = '20261124f';
  var API = (window.SEISEKI_CONFIG && window.SEISEKI_CONFIG.API_URL && window.SEISEKI_CONFIG.API_URL.dev) || '';
  var ENV = /\/dev\//.test(location.pathname) ? 'dev' : 'prod';
  var KEY = 'hub-dev.sid';
  var teacher = /^#(teacher|admin)$/.test(location.hash);
  var sid = '', myName = '', cur = null, loaded = {};

  /* ── 탭 정의: pane = 그려질 칸 id ── */
  var STUDENT = [
    { id: 'home', label: '홈', icon: 'm-rocket', pane: 'p-home', mount: mountHome },
    { id: 'grades', label: '성적', icon: 'm-note', pane: 'p-a', mount: mountGrades },
    { id: 'quiz', label: '퀴즈', icon: 'm-quiz', pane: 'p-b', mount: mountQuiz },
    { id: 'curriculum', label: '커리큘럼', icon: 'm-book', pane: 'p-c', mount: mountCurriculum },
    { id: 'qna', label: 'QnA', icon: 'm-pencil', pane: 'p-d', mount: mountQna }
  ];
  var TEACHER = [
    { id: 'grades', label: '성적', icon: 'm-note', pane: 'p-a', mount: mountGradesAdmin },
    { id: 'quiz', label: '퀴즈', icon: 'm-quiz', pane: 'p-b', mount: mountQuiz },
    { id: 'qna', label: 'QnA 관리', icon: 'm-pencil', pane: 'p-d', mount: mountQnaAdmin }
  ];
  var TABS = teacher ? TEACHER : STUDENT;

  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return null; } }
  // 안쪽 화면이 지난 사람의 번호를 기억하고 있으면 새 번호가 안 먹으니 먼저 지움
  function wipeInner() { var k = ENV === 'dev' ? ['seiseki-dev.code', 'seiseki-dev.view', 'kitaku-dev.me'] : ['seiseki.code', 'seiseki.view', 'kitaku.me']; k.forEach(function (x) { store(x, null); }); }
  function loadScript(src) { return new Promise(function (res, rej) { var e = document.createElement('script'); e.src = src; e.onload = res; e.onerror = rej; document.head.appendChild(e); }); }
  function soon(el, what) { el.innerHTML = '<div class="hub-soon">' + HubMascots.svg('m-sleep', 96, 'hm-float') + '<b>' + what + ' 준비 중이에요</b><span>곧 열려요. 조금만 기다려 주세요.</span></div>'; }

  /* ── 탭별 화면 붙이기 (처음 열 때 한 번) ── */
  function mountHome(el) { return loadScript('home/home.js?v=' + V).then(function () { HubHome.mount(el, { session: HubSession, name: myName, go: show }); }); }
  function mountGrades(el) { return loadScript('grades-native/gr.js?v=' + V).then(function () { HubGrades.mount(el, { code: sid, name: myName, apiUrl: API, env: ENV, onAuthError: function () { leave(); } }); }); }
  function mountQuiz() {
    window.HUB = 1; window.HUB_ENV = ENV;
    if (!teacher) { try { localStorage.setItem((ENV === 'dev' ? 'kitaku-dev.' : 'kitaku.') + 'me', JSON.stringify({ id: sid, nm: myName })); } catch (e) {} }
    return loadScript('https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js').catch(function () {})
      .then(function () { return loadScript('qz/data.js?v=' + V); }).then(function () { return loadScript('qz/quiz.js?v=' + V); });
  }
  function mountCurriculum(el) { return loadScript('curriculum/cur.js?v=' + V).then(function () { HubCurriculum.mount(el, { session: HubSession }); }, function () { soon(el, '커리큘럼'); }); }
  function mountQna(el) { return loadScript('qna/qna.js?v=' + V).then(function () { HubQna.mount(el, { session: HubSession }); }, function () { soon(el, 'QnA'); }); }
  function relogin() { HubSession.clear(); $('#h-top').hidden = true; ['p-home', 'p-a', 'f-a', 'p-b', 'p-c', 'p-d'].forEach(function (p) { $('#' + p).hidden = true; }); loaded = {}; $('#h-gate').hidden = false; $('#h-pwerr').textContent = '로그인이 풀렸어요. 다시 입력해 주세요.'; $('#h-pw').value = ''; $('#h-pw').focus(); }
  function mountGradesAdmin(el) {
    return loadScript('grades-admin/ga.js?v=' + V).then(function () {
      HubGradesAdmin.mount(el, { session: HubSession, apiUrl: API, env: ENV, onAuthError: relogin });
    }, function () {   // 새 강사 화면이 아직 없으면 옛 화면을 그대로 끼워 씀
      var f = $('#f-a'); el.hidden = true; f.hidden = false; f.src = 'grades.html?embed=1#teacher';
    });
  }
  function mountQnaAdmin(el) {
    return loadScript('qna/qna.js?v=' + V).then(function () { HubQnaAdmin.mount(el, { session: HubSession, onPending: function (n) { badge('qna', n); }, onAuthError: relogin }); }, function () { soon(el, 'QnA 관리'); });
  }
  function badge(id, n) { document.querySelectorAll('.hub-tab[data-id="' + id + '"] .bd').forEach(function (b) { b.remove(); }); if (n > 0) document.querySelectorAll('.hub-tab[data-id="' + id + '"]').forEach(function (t) { var b = document.createElement('span'); b.className = 'bd'; b.textContent = n > 99 ? '99+' : n; t.appendChild(b); }); }

  function tabsHtml() {
    ['h-tabs', 'h-bar'].forEach(function (nid) {
      var t = $('#' + nid); t.innerHTML = '';
      TABS.forEach(function (x) {
        var b = document.createElement('button'); b.className = 'hub-tab'; b.type = 'button'; b.setAttribute('role', 'tab'); b.dataset.id = x.id;
        b.innerHTML = '<svg><use href="#' + x.icon + '"/></svg>' + x.label; b.onclick = function () { show(x.id); }; t.appendChild(b);
      });
    });
  }
  function show(id) {
    var tab = TABS.filter(function (x) { return x.id === id; })[0] || TABS[0]; id = tab.id; cur = id;
    TABS.forEach(function (x) { document.querySelectorAll('.hub-tab[data-id="' + x.id + '"]').forEach(function (b) { b.setAttribute('aria-selected', x.id === id); }); });
    ['p-home', 'p-a', 'f-a', 'p-b', 'p-c', 'p-d'].forEach(function (p) { $('#' + p).hidden = p !== tab.pane; });
    if (!loaded[id]) { loaded[id] = 1; Promise.resolve(tab.mount($('#' + tab.pane))).catch(function () { soon($('#' + tab.pane), tab.label); }); }
    else if (id === 'grades' && window.HubGrades && !teacher) { /* 이미 열려 있음 */ }
    try { history.replaceState(null, '', location.pathname + location.search + (teacher ? '#teacher' : (id === 'home' ? '' : '#' + id))); } catch (e) {}
  }
  function enter(s, nm) {
    sid = s; myName = nm || ''; loaded = {};
    HubSession.init({ code: s, name: nm, env: ENV, apiUrl: API });
    $('#h-login').hidden = true; $('#h-top').hidden = false; $('#h-who').textContent = nm ? nm + ' 학생' : '';
    tabsHtml(); var h = (location.hash || '').slice(1); show(STUDENT.some(function (x) { return x.id === h; }) ? h : 'home');
  }
  function leave() {
    store(KEY, null); wipeInner(); HubSession.clear(); sid = ''; loaded = {};
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
    location.reload();   // 퀴즈·성적이 페이지 안에서 돌고 있으니 새로 불러와 지난 사람의 상태를 모두 비움
  }

  var fails = 0, lockUntil = 0;
  function login(raw, remember, quiet) {
    var code = Core.normCode(raw), err = $('#h-err');
    if (Date.now() < lockUntil) { err.textContent = '잠시 후 다시 시도해 주세요.'; return; }
    var p = Core.codeProblem ? Core.codeProblem(code) : (Core.isValidCode(code) ? '' : 'format');
    if (p) { err.textContent = p === 'short' ? '영문 2자 + 숫자 6자리를 모두 넣어 주세요.' : '번호를 다시 확인해 주세요.'; if (p === 'check' && ++fails >= 5) { lockUntil = Date.now() + 60000; fails = 0; } return; }
    if (!API) { err.textContent = '서버 주소가 없어요. config.js 를 확인해 주세요.'; return; }
    $('#h-go').disabled = true; err.textContent = '';
    fetch(API + '?mode=who&id=' + encodeURIComponent(code)).then(function (r) { return r.json(); }).then(function (d) {
      $('#h-go').disabled = false;
      if (d && d.ok && d.member) { fails = 0; wipeInner(); if (remember) store(KEY, code); enter(code, d.nm); }
      else if (d && d.error === 'busy') err.textContent = '잠시 후 다시 시도해 주세요.';
      else { if (!quiet) err.textContent = '등록되지 않은 번호예요. 선생님께 확인해 주세요.'; if (++fails >= 5) { lockUntil = Date.now() + 60000; fails = 0; } store(KEY, null); }
    }).catch(function () { $('#h-go').disabled = false; if (!quiet) err.textContent = '인터넷 연결을 확인하고 다시 눌러 주세요.'; });
  }

  $('#h-sid').addEventListener('input', function () { var v = Core.normCode(this.value); this.value = Core.fmtCode ? Core.fmtCode(v) : v; $('#h-err').textContent = ''; });
  $('#h-sid').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('#h-go').click(); });
  $('#h-go').onclick = function () { login($('#h-sid').value, $('#h-rem').checked); };
  $('#h-out').onclick = leave;
  $('#h-brand').onclick = function (e) { e.preventDefault(); if (!$('#h-top').hidden) show(TABS[0].id); };

  // 시작: 강사(#teacher)는 로그인 없이 강사 탭 / 학생은 #sid= 로 넘어왔거나 기억한 번호가 있으면 바로
  if (teacher) {
    HubSession.init({ code: '', name: '', env: ENV, apiUrl: API });
    $('#h-login').hidden = true; $('#h-gate').hidden = false; $('#h-who').textContent = '선생님';
    var gate = function () {
      var pw = $('#h-pw').value; if (!pw) return; $('#h-pwgo').disabled = true; $('#h-pwerr').textContent = '';
      HubSession.adminLogin(pw).then(function (r) {
        $('#h-pwgo').disabled = false;
        if (!r.ok) { $('#h-pwerr').textContent = r.error || '로그인하지 못했어요.'; return; }
        $('#h-pw').value = ''; $('#h-gate').hidden = true; $('#h-top').hidden = false; $('#h-who').textContent = '선생님'; loaded = {};
        tabsHtml(); var h = (location.hash || '').slice(1); show('grades');
      });
    };
    $('#h-pwgo').onclick = gate; $('#h-pw').addEventListener('keydown', function (e) { if (e.key === 'Enter') gate(); });
    setTimeout(function () { $('#h-pw').focus(); }, 50);
  }
  else {
    var hm = /[#&]sid=([A-Za-z0-9 -]{6,12})/.exec(location.hash), saved = store(KEY);
    if (hm) { try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} login(hm[1], false); }
    else if (saved) { $('#h-rem').checked = true; login(saved, true, true); }
    else $('#h-sid').focus();
  }
})();
</script>
</body>
</html>
