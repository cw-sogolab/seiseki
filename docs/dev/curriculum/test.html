<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HubCurriculum 테스트</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800;900&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="cur.css">
<style>
/* 허브 틀 흉내: 바탕색만 가진 빈 페이지. ?clash 로 열면 일부러 전역 규칙을 심어 .cur 가 흔들리는지 확인 */
html,body{margin:0}
body{background:#F5F3FF;font-family:sans-serif}
@media (prefers-color-scheme: dark){body{background:#14122B;color:#fff}}
.tbar{padding:10px 16px;font:600 13px sans-serif;background:#ff6a3d;color:#fff;line-height:1.9}
.tbar a{color:#fff;margin-right:10px}
body.clash button{background:red;border-radius:0}
body.clash h2{font-size:40px}
body.clash ul,body.clash ol{padding-left:40px;list-style:disc}
body.clash *{font-family:serif}
</style>
</head>
<body>
<div class="tbar">HubCurriculum 테스트 ·
  <a href="?demo">?demo (가상 샘플)</a>
  <a href="?demo&today=2026-11-12">오늘=11/12</a>
  <a href="?demo&today=2027-02-01">오늘=2027-02-01 (다 지남)</a>
  <a href="?demo&case=empty">수강 반 없음</a>
  <a href="?demo&case=noplan">계획서 없음</a>
  <a href="?demo&case=error">오류</a>
  <a href="?demo&case=slow">느린 응답</a>
  <a href="?live&code=KM482919">?live (서울 서버)</a>
  <a href="?demo&clash">충돌 테스트</a>
  <a href="?demo&unmount">mount→unmount→mount</a>
</div>
<div id="wrap"><div id="root"></div></div>
<script src="../../assets/config.js"></script>
<script src="../hub-session.js"></script>
<script src="../assets/mascots.js"></script>
<script src="cur.js"></script>
<script>
var Q = new URLSearchParams(location.search), LIVE = Q.has('live');
if (Q.has('clash')) document.body.classList.add('clash');

/* ---- 가상 샘플 (실제 학생·반 정보 아님) ---- */
function demoData() {
  var head = function (name, goal, book, extra) {
    return Object.assign({ '강의명': name, '부제': '', '강의목표': goal, '담당강사': '현채원 | [연락처/톡ID]', '강의기간': '', '강의시간': '화·목 19:00-21:00', '강의실': '', '교재': book,
      '질문시간': '상시', '질문방법': '카톡 오픈채팅', '평가방법': '주간 평가 (v)\n평가 방법 및 기준 : 주간 퀴즈 / 피드백 방법 : 퀴즈 프린트' }, extra || {});
  };
  var nov = [
    { round: '01', date: '2026-11-03', content: '1강 국가의 원칙 / 2강 민주국가의 성립', range: 'p.5-11', homework: '' },
    { round: '02', date: '2026-11-05', content: '3강 인권 / 4강 세계의 정치제도', range: 'p.12-30', homework: '주간 숙제' },
    { round: '03', date: '2026-11-10', content: '5강 대일본제국헌법과 일본국헌법 / 6강 일본국헌법의 인권보장', range: 'p.31-42', homework: '' },
    { round: '04', date: '2026-11-12', content: '7강 일본국헌법의 평화주의', range: 'p.43-47', homework: '주간 숙제' },
    { round: '05', date: '2026-11-17', content: '8강 일본국헌법의 정치제도', range: 'p.48-64', homework: '' },
    { round: '06', date: '2026-11-19', content: '9강 정당과 정당정치 / 10강 현대정치의 문제들', range: 'p.65-85', homework: '주간 숙제' },
    { round: '07', date: '2026-11-26', content: '11강 국제사회와 국제연합', range: 'p.86-96', homework: '' },
    { round: '08', date: '2026-11-28', content: '월말테스트', range: '', homework: '' }
  ];
  var oct = [
    { round: '01', date: '10월 6일', content: '개강 · 1강 시민혁명', range: 'p.1-12', homework: '' },
    { round: '02', date: '10월 8일', content: '2강 권력분립', range: 'p.13-20', homework: '주간 숙제' },
    { round: '03', date: '10월 13일', content: '3강 선거제도', range: 'p.21-33', homework: '' }
  ];
  var danpul = [
    { round: '01', date: '2026-11-07', content: '1회 OX · 기본 · 심화', range: '1회', homework: 'EJU 기출' },
    { round: '02', date: '2026-11-14', content: '2회 OX · 기본 · 심화', range: '2회', homework: 'EJU 기출' },
    { round: '03', date: '2026-11-21', content: '3회 OX · 기본 · 심화', range: '3회', homework: 'EJU 기출' },
    { round: '04', date: '2026-11-28', content: '월말테스트', range: '', homework: '' }
  ];
  var silj = [
    { round: '01', date: '2026-11-14', content: '모의고사 1회 실시 및 해설', range: '', homework: '' },
    { round: '02', date: '2026-11-15', content: '모의고사 1회 실시 및 해설', range: '', homework: '' }
  ];
  return { classes: [
    { code: 'K-POL', name: '정치 개념', kind: '개념', time: '화목 19:00', months: [
      { month: '2026-11', head: head('종과개념 개념-정치', '민주정치의 발전과 세계의 정치 체제에 대한 개념 익히기', '학원 교재, 프린트'), rows: nov, cal: { start: '2026-11-03', end: '2026-11-28', off: ['2026-11-24', ['2026-11-03', '']] } },
      { month: '2026-10', head: head('종과개념 개념-정치', '민주정치의 기초 개념 익히기', '학원 교재'), rows: oct, cal: { start: '2026-10-06', end: '2026-10-29', off: [['2026-10-15', '현충일 대체 휴강']] } },
      { month: '2026-09', head: null, rows: [], cal: null }
    ] },
    { code: 'D-ECO', name: '경제 단풀', kind: '단풀', time: '토 14:00', months: [
      { month: '2026-11', head: head('종과 단풀 경제', '단원별 문제 풀이로 EJU 경제 실전 감각 익히기', 'WON UNIT 경제', { '강의시간': '토 14:00-17:00' }), rows: danpul, cal: { start: '2026-11-07', end: '2026-11-28', off: [] } }
    ] },
    { code: 'R-D', name: '실전 문제풀이D', kind: '실전', time: '토일', months: [
      { month: '2026-11', head: head('실전 문제풀이D', '실전 모의고사 풀이를 통한 EJU 실전 대비', ''), rows: silj, cal: null }
    ] }
  ] };
}
var C = Q.get('case');
var fake = {
  name: '가상 학생',
  call: function (action, payload) {
    if (action !== 'curriculum') return Promise.resolve({ ok: false, error: '알 수 없는 요청: ' + action });
    var wait = C === 'slow' ? 2500 : 250;
    return new Promise(function (res) {
      setTimeout(function () {
        if (C === 'error') return res({ ok: false, error: '서버가 응답하지 않아요.' });
        if (C === 'empty') return res({ ok: true, data: { classes: [] } });
        if (C === 'noplan') return res({ ok: true, data: { classes: [{ code: 'K-POL', name: '정치 개념', kind: '개념', time: '화목 19:00', months: [] }] } });
        res({ ok: true, data: demoData() });
      }, wait);
    });
  }
};
var cfg = (window.SEISEKI_CONFIG || {}).API_URL || {};
function mk() {
  if (LIVE) { HubSession.init({ code: Q.get('code') || 'KM482919', env: 'dev', apiUrl: Q.get('api') || cfg.dev }); return HubSession; }
  return fake;
}
function go() { HubCurriculum.mount(document.getElementById('root'), { session: mk(), today: Q.get('today') || '2026-11-11', onAuthError: function (m) { console.warn('auth error:', m); } }); }
if (Q.get('w')) { document.getElementById('wrap').style.cssText = 'width:' + Q.get('w') + 'px;overflow-x:auto'; }
go();
/* 가로 넘침 검사 결과를 data-overflow 에 적어 둠 (?w=390 으로 폭을 좁혀 볼 때) */
setTimeout(function () { var w = document.getElementById('wrap'), r = document.getElementById('root'); var bad = []; r.querySelectorAll('*').forEach(function (e) { var b = e.getBoundingClientRect(); if (b.right > w.getBoundingClientRect().right + 1 && b.width > 0) bad.push(e.className || e.tagName); }); document.body.setAttribute('data-overflow', bad.length ? bad.slice(0, 5).join(',') : 'none'); }, 1500);
if (Q.has('unmount')) setTimeout(function () { HubCurriculum.unmount(); document.getElementById('root').innerHTML = '<p style="padding:20px">unmount 됨 — 1초 뒤 다시 mount</p>'; setTimeout(go, 1000); }, 1500);
</script>
</body>
</html>
