<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>디자인 시안 10개 · cw-sogolab</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
*{box-sizing:border-box}
body{margin:0;background:#F3F1EC;color:#17151F;font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo",sans-serif;-webkit-font-smoothing:antialiased;word-break:keep-all}
header{max-width:1400px;margin:0 auto;padding:36px 24px 10px}
header small{font-weight:800;font-size:12px;letter-spacing:.08em;background:#17151F;color:#fff;border-radius:999px;padding:5px 12px}
h1{font-size:clamp(30px,5vw,52px);font-weight:900;letter-spacing:-.03em;margin:14px 0 8px;line-height:1.1}
header p{margin:0;font-size:16px;line-height:1.6;color:#55506a;max-width:760px}
main{max-width:1400px;margin:0 auto;padding:18px 24px 60px;display:grid;gap:22px}
.opt{background:#fff;border-radius:26px;padding:20px 22px 22px;box-shadow:0 2px 14px rgba(20,16,40,.07)}
.opt .hd{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 14px;margin-bottom:4px}
.opt .k{font-weight:900;font-size:15px;background:#17151F;color:#fff;border-radius:10px;padding:3px 10px}
.opt h2{margin:0;font-size:24px;font-weight:900;letter-spacing:-.02em}
.opt .ref{font-size:13px;font-weight:700;color:#7a7590}
.opt p{margin:4px 0 12px;font-size:15px;line-height:1.6;color:#4a4560;max-width:900px}
.opt a.open{margin-left:auto;font-weight:800;font-size:14px;text-decoration:none;color:#fff;background:#5B4BF0;border-radius:999px;padding:8px 16px;white-space:nowrap}
.fr{border-radius:18px;overflow:hidden;border:1px solid #e6e2f0;background:#eee;height:470px;position:relative}
.fr iframe{position:absolute;left:0;top:0;width:2200px;height:1900px;border:0;transform-origin:0 0;pointer-events:none}
.fr.empty{display:grid;place-items:center;color:#8a86a0;font-weight:700}
.tip{font-size:13px;color:#7a7590;margin:10px 0 0}
</style>
</head>
<body>
<header>
  <small>디자인 시안 · 2026-11-25</small>
  <h1>시안 10개 — 같은 화면, 다른 디자인</h1>
  <p>열 시안 모두 화면 구성은 같습니다. 첫째 줄이 필수 화면(메인 · 성적노트 · 퇴근 미션 · 어드민), 둘째 줄이 추가 화면(클리어 · 꾸미기 · 수업 맵)입니다. 「크게 보기」로 열면 꾸미기 화면의 아이템을 눌러 캐릭터를 바꿔 볼 수 있어요. 숫자·이름은 전부 가짜 예시입니다.</p>
</header>
<main id="list"></main>
<script>
var OPTS = [
  ['a', '팝 스티커', '참고: Dorst & Lesser', '납작한 원색 바탕에 큰 글자, 검은 테두리와 딱딱한 그림자, 알약 버튼. 가볍고 빠르며 만들기 쉽습니다.'],
  ['b', '3D 클레이 · 토스', '참고: Welly Clip\'N\'Go · 처음에 주신 3D 캐릭터 이미지', '말랑한 점토 느낌의 3D 캐릭터와 토스 같은 단순·큼직한 화면. 지금 성적노트와 가장 자연스럽게 이어집니다.'],
  ['c', '네온 아케이드', '참고: Experience FunTech Creativity', '밤 골목의 네온 간판과 게임 화면. 스테이지·게이지·코인으로 「게임 하는 느낌」이 가장 강합니다.'],
  ['d', '레트로 카툰', '참고: Yaas Energy!', '노을 그라데이션과 물결치는 글자, 굵은 외곽선의 만화 과일 캐릭터. 밝고 익살스럽습니다.'],
  ['e', '스낵 포스터', '참고: Henrietta Said', '화면 가득한 초대형 글자 앞에 캐릭터가 서는 포스터 스타일. 문구의 재치가 중심입니다.'],
  ['f', '화이트 갤러리', '참고: ribbit', '흰 여백과 우아한 세리프 제목, 그 위에 알록달록한 3D 블롭 캐릭터 하나. 조용하고 고급스럽습니다.'],
  ['g', '투 톤 손그림', '참고: dontboardme', '미색 바탕에 빨강 한 색, 초대형 컨덴스드 제목과 붓 선 손그림. 색을 거의 쓰지 않아 강렬합니다.'],
  ['h', '하늘 간판 타워', '참고: thinkbigstudio', '파란 하늘과 3D 구름, 타워를 두른 간판 패널이 메뉴. 밝고 장난감 같은 세계입니다.'],
  ['i', '애시드 라임 소스', '참고: elegantseagulls /sauce', '살구 회색·검정에 형광 라임 한 색, 흘러내리는 유광 소스 덩어리. 힙하고 대비가 셉니다.'],
  ['j', '블루 볼 파티', '참고: joinflowparty (gdweb 캡처 기준)', '일렉트릭 블루 바탕, 큰 글자의 ㅇ 자리를 3D 공 캐릭터가 대신합니다. 라임 탭과 핑크 배지가 포인트.']
];
var list = document.getElementById('list');
OPTS.forEach(function (o) {
  var s = document.createElement('section'); s.className = 'opt';
  s.innerHTML = '<div class="hd"><span class="k">시안 ' + o[0].toUpperCase() + '</span><h2>' + o[1] + '</h2><span class="ref">' + o[2] + '</span><a class="open" href="sian-' + o[0] + '.html" target="_blank" rel="noopener">크게 보기 →</a></div><p>' + o[3] + '</p><div class="fr" data-src="sian-' + o[0] + '.html"></div>';
  list.appendChild(s);
});
// 미리보기: 큰 화면(1560px)으로 그린 뒤 칸 너비에 맞춰 줄임. 아직 파일이 없으면 「만드는 중」
function fit() { document.querySelectorAll('.fr iframe').forEach(function (f) { var w = f.parentElement.clientWidth, k = w / 2200; f.style.transform = 'scale(' + k + ')'; f.parentElement.style.height = Math.round(1900 * k) + 'px'; }); }
document.querySelectorAll('.fr').forEach(function (el) {
  fetch(el.dataset.src, { method: 'HEAD' }).then(function (r) {
    if (!r.ok) throw 0;
    var f = document.createElement('iframe'); f.src = el.dataset.src; f.title = el.dataset.src; f.loading = 'lazy'; el.appendChild(f); fit();
  }).catch(function () { el.classList.add('empty'); el.textContent = '만드는 중이에요'; });
});
window.addEventListener('resize', fit);
</script>
</body>
</html>
