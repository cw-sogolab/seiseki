<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HubQna 테스트</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800;900&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="qna.css">
<style>
/* 허브 틀 흉내: 바탕색만 가진 빈 페이지. ?clash 로 열면 전역 규칙을 일부러 심어 .qna 가 흔들리는지 확인 */
html,body{margin:0}
body{background:#F5F3FF;font-family:sans-serif}
@media (prefers-color-scheme: dark){body{background:#14122B;color:#fff}}
.tb{padding:10px 16px;font:600 13px sans-serif;background:#ff6a3d;color:#fff;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.tb a{color:#fff}
.tb input{font:inherit;padding:4px 8px;border-radius:6px;border:0;width:140px}
.cols{display:grid;grid-template-columns:1fr;gap:0}
@media (min-width:1100px){.cols.both{grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:24px}}
.colh{font:700 12px sans-serif;color:#8C87AD;padding:10px 16px 0;letter-spacing:.06em}
body.clash button{background:red;border-radius:0}
body.clash h1,body.clash h2{font-size:40px}
body.clash *{font-family:serif}
</style>
</head>
<body>
<div class="tb" id="tb"></div>
<div class="cols" id="cols"></div>
<script src="../assets/mascots.js"></script>
<script src="../hub-session.js"></script>
<script src="qna.js"></script>
<script>
var Q = new URLSearchParams(location.search);
var VIEW = Q.get('view') || 'student', LIVE = Q.has('live'), DOWN = Q.has('down');
if (Q.has('clash')) document.body.classList.add('clash');
HubMascots.mount();

/* ---------------- 메모리 가짜 서버 (서버 계약 그대로) ---------------- */
var KEY = 'qna-test-db';
function nowStr() { var d = new Date(), p = function (n) { return (n < 10 ? '0' : '') + n; }; return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()); }
function ago(h) { var d = new Date(Date.now() - h * 3600e3), p = function (n) { return (n < 10 ? '0' : '') + n; }; return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()); }
function svgPh(label, c1, c2) {
  var s = '<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="' + c1 + '"/><stop offset="1" stop-color="' + c2 + '"/></linearGradient></defs><rect width="480" height="360" fill="url(#g)"/><text x="240" y="190" font-size="34" font-family="sans-serif" font-weight="700" fill="#fff" text-anchor="middle">' + label + '</text></svg>';
  return { mime: 'image/svg+xml', b64: btoa(unescape(encodeURIComponent(s))) };
}
function seed() {
  var photos = { F1: svgPh('예시 사진 1', '#7466FF', '#5B4BF0'), F2: svgPh('예시 사진 2', '#7DF0CF', '#0FA382'), F3: svgPh('답변 사진', '#FFCB85', '#FF7A3D') };
  var qs = [
    { id: 'Q1', owner: 'me', code: 'KM482919', name: '가상민', cls: '[월수 19:00] 경제 개념', subject: '경제', title: '수요곡선이 이동하는 경우와 곡선 위의 이동이 헷갈려요', body: '교재 52쪽 문제 7번인데요,\n가격이 변할 때는 곡선 위의 이동이고 소득이 변할 때는 곡선 자체가 이동하는 거 맞나요?', public: true, at: ago(30), status: '답변', answer: '네, 맞아요. 그 상품의 가격 변화는 곡선 위의 이동, 가격 이외의 요인(소득·선호·대체재 가격 등)이 바뀌면 곡선 자체가 이동해요.\n7번은 소득이 늘어서 수요가 증가한 경우라 오른쪽으로 이동이에요.', answerAt: ago(20), photos: ['F1'], answerPhotos: ['F3'] },
    { id: 'Q2', owner: 'me', code: 'KM482919', name: '가상민', cls: '[월수 19:00] 경제 개념', subject: '정치', title: '삼권분립이랑 권력분립의 차이가 뭐예요?', body: '용어가 둘 다 나와서요.', public: false, at: ago(2), status: '대기', answer: '', answerAt: '', photos: [], answerPhotos: [] },
    { id: 'Q3', owner: 's2', code: 'RT551203', name: '나가상', cls: '[화목 18:30] 지리 단풀', subject: '지리', title: '위도에 따른 기온차 그래프 읽는 법', body: '그래프에서 연교차가 큰 지역은 어떻게 찾나요?', public: true, at: ago(50), status: '답변', answer: '월별 기온 그래프에서 가장 높은 달과 가장 낮은 달의 차이가 연교차예요. 대륙 안쪽일수록 커져요.', answerAt: ago(40), photos: ['F2'], answerPhotos: [] },
    { id: 'Q4', owner: 's3', code: 'WB190466', name: '다가상', cls: 'EJU 실전반 D', subject: '역사', title: '메이지 유신 이후 헌법 제정 순서', body: '대일본제국헌법이 발포되기 전에 있었던 일이 뭔지 정리하고 싶어요.', public: true, at: ago(5), status: '대기', answer: '', answerAt: '', photos: [], answerPhotos: [] },
    { id: 'Q5', owner: 's2', code: 'RT551203', name: '나가상', cls: '[화목 18:30] 지리 단풀', subject: '기타', title: '시험 접수 일정 문의', body: '다음 시험 접수는 언제부터인가요? 개인적인 일정이라 비공개로 해요.', public: false, at: ago(70), status: '답변', answer: '다음 주 공지에 올릴게요.', answerAt: ago(60), photos: [], answerPhotos: [] },
    { id: 'Q6', owner: 's4', code: 'HJ338120', name: '라가상', cls: '[월수 19:00] 현대사회 개념', subject: '현대사회', title: '사회보장제도 종류를 표로 정리해 주실 수 있나요', body: '사회보험, 공공부조, 사회서비스가 헷갈립니다.', public: true, at: ago(100), status: '답변', answer: '사회보험(연금·건강·고용·산재)은 보험료를 내고, 공공부조는 세금으로 생활이 어려운 사람을, 사회서비스는 돌봄·상담 같은 서비스를 줘요.', answerAt: ago(90), photos: [], answerPhotos: [] }
  ];
  return { qs: qs, photos: photos, n: 10, times: [] };
}
var DB;
try { DB = JSON.parse(sessionStorage.getItem(KEY) || 'null'); } catch (e) { DB = null; }
if (!DB || Q.has('reset')) DB = seed();
function save() { try { sessionStorage.setItem(KEY, JSON.stringify(DB)); } catch (e) { /* 용량 넘으면 메모리만 */ } }
function mask(n) { return n ? n.charAt(0) + '○○' : '○○○'; }
function sq(q) { return { id: q.id, subject: q.subject, title: q.title, body: q.body, public: q.public, at: q.at, status: q.status, answer: q.answer, answerAt: q.answerAt, photos: q.photos, answerPhotos: q.answerPhotos, mine: q.owner === 'me', who: q.owner === 'me' ? '나' : mask(q.name) }; }
function aq(q) { var o = sq(q); o.code = q.code; o.name = q.name; o.classes = [q.cls]; o.mine = false; o.who = q.name; return o; }
var fakeLog = [];
function fake(action, p, role) {
  fakeLog.push(role + ':' + action);
  var ok = function (d) { return { ok: true, data: d }; }, bad = function (e) { return { ok: false, error: e }; };
  function find(id) { return DB.qs.filter(function (q) { return q.id === id; })[0]; }
  function checkPhotos(ph) {
    if (!Array.isArray(ph) || ph.length > 3) return '사진은 3장까지 올릴 수 있어요.';
    for (var i = 0; i < ph.length; i++) {
      if (!ph[i] || typeof ph[i].b64 !== 'string' || ph[i].b64.indexOf('/9j/') !== 0) return '사진은 JPEG 만 올릴 수 있어요.';
      if (ph[i].b64.length * 0.75 > 3 * 1024 * 1024) return '사진은 장당 3MB 까지예요.';
    }
    return '';
  }
  function store(ph) { return ph.map(function (x) { var id = 'F' + (++DB.n); DB.photos[id] = { mime: 'image/jpeg', b64: x.b64 }; return id; }); }
  if (role === 'student') {
    if (action === 'qnaList') {
      var mine = DB.qs.filter(function (q) { return q.owner === 'me'; }).sort(function (a, b) { return b.at < a.at ? -1 : 1; });
      var pub = DB.qs.filter(function (q) { return q.public && q.status === '답변'; }).sort(function (a, b) { return b.answerAt < a.answerAt ? -1 : 1; });
      return ok({ mine: mine.map(sq), pub: pub.map(sq) });
    }
    if (action === 'qnaAsk') {
      var t = Date.now(); DB.times = DB.times.filter(function (x) { return t - x < 60000; });
      if (DB.times.length >= 5) return bad('너무 빨리 올리고 있어요. 1분 뒤에 다시 해 주세요.');
      if (['정치', '경제', '현대사회', '지리', '역사', '기타'].indexOf(p.subject) < 0) return bad('과목을 골라 주세요.');
      if (!p.title || p.title.length > 80) return bad('제목은 1~80자로 적어 주세요.');
      if (!p.body || p.body.length > 2000) return bad('내용은 1~2000자로 적어 주세요.');
      var pe = checkPhotos(p.photos || []); if (pe) return bad(pe);
      var q = { id: 'Q' + (++DB.n), owner: 'me', code: 'KM482919', name: '가상민', cls: '[월수 19:00] 경제 개념', subject: p.subject, title: p.title, body: p.body, public: !!p.public, at: nowStr(), status: '대기', answer: '', answerAt: '', photos: store(p.photos || []), answerPhotos: [] };
      DB.qs.push(q); DB.times.push(t); save(); return ok({ id: q.id });
    }
    if (action === 'qnaPhoto') { var ph = DB.photos[p.id]; return ph ? ok(ph) : bad('사진을 찾을 수 없어요.'); }
    if (action === 'qnaDelete') {
      var d = find(p.id); if (!d || d.owner !== 'me') return bad('내 질문이 아니에요.');
      if (d.status !== '대기') return bad('답변이 달린 질문은 지울 수 없어요.');
      DB.qs.splice(DB.qs.indexOf(d), 1); save(); return ok({});
    }
  } else {
    if (action === 'qnaAdminList') return ok(DB.qs.filter(function (q) { return !p.status || q.status === p.status; }).map(aq));
    if (action === 'qnaAnswer') {
      var a = find(p.id); if (!a) return bad('질문을 찾을 수 없어요.');
      if (!p.answer || !String(p.answer).trim()) return bad('답변을 적어 주세요.');
      var pe2 = checkPhotos(p.photos || []); if (pe2) return bad(pe2);
      if (String(p.answer).trim().length > 3000) return bad('답변은 3000자까지 쓸 수 있어요.');
      var keep = a.answerPhotos.filter(function (f) { return (p.removePhotos || []).indexOf(f) < 0; });
      if (keep.length + (p.photos || []).length > 3) return bad('답변 사진은 3장까지 올릴 수 있어요.');
      a.answer = String(p.answer).trim(); a.answerAt = nowStr(); a.status = '답변';
      if (typeof p.public === 'boolean') a.public = p.public;   // 생략하면 학생이 고른 값 그대로
      a.answerPhotos = keep.concat(store(p.photos || []));   // 새 사진은 남긴 기존 답변 사진 뒤에 붙음
      save(); return ok({});
    }
    if (action === 'qnaAdminDelete') { var x = find(p.id); if (!x) return bad('질문을 찾을 수 없어요.'); DB.qs.splice(DB.qs.indexOf(x), 1); save(); return ok({}); }
    if (action === 'qnaAdminPhoto') { var ph2 = DB.photos[p.id]; return ph2 ? ok(ph2) : bad('사진을 찾을 수 없어요.'); }
  }
  return bad('알 수 없는 요청이에요: ' + action);
}
function later(v) { return new Promise(function (r) { setTimeout(function () { r(v); }, 350); }); }
var demoSession = {
  call: function (a, p) { return DOWN ? later({ ok: false, error: '인터넷 연결을 확인해 주세요.' }) : later(fake(a, p, 'student')); },
  adminCall: function (a, p) { return DOWN ? later({ ok: false, error: '인터넷 연결을 확인해 주세요.' }) : later(fake(a, p, 'admin')); }
};

/* ---------------- 화면 ---------------- */
var cfg = (window.SEISEKI_CONFIG || {}).API_URL || {};
var session = demoSession;
var tb = document.getElementById('tb'), cols = document.getElementById('cols');
function link(label, qs) { return '<a href="?' + qs + '">' + label + '</a>'; }
tb.innerHTML = 'HubQna 테스트 · ' + link('학생(데모)', 'view=student') + link('강사(데모)', 'view=admin') + link('나란히', 'view=both') + link('오류화면', 'view=both&down') + link('초기화', 'view=' + VIEW + '&reset') + link('충돌', 'view=' + VIEW + '&clash') + link('실서버', 'view=' + VIEW + '&live') + '<span id="pend"></span>';
function pendTxt(n) { document.getElementById('pend').textContent = ' · 대기 뱃지: ' + n; }
function addCol(id, title) { var c = document.createElement('div'); c.innerHTML = '<div class="colh">' + title + '</div><div id="' + id + '"></div>'; cols.appendChild(c); return document.getElementById(id); }
if (VIEW === 'both') cols.classList.add('both');
function run() {
  if (VIEW === 'student' || VIEW === 'both') HubQna.mount(addCol('stu', '학생용'), { session: session });
  if (VIEW === 'admin' || VIEW === 'both') HubQnaAdmin.mount(addCol('adm', '강사용'), { session: session, onPending: pendTxt });
}
if (LIVE) {
  /* 실서버: 번호는 ?code=, 강사 화면은 비밀번호 칸에 직접 입력 (주소에 안 넣음) */
  session = HubSession;
  HubSession.init({ code: Q.get('code') || '', name: '', env: 'dev', apiUrl: Q.get('api') || cfg.dev });
  if (VIEW === 'admin' || VIEW === 'both') {
    tb.insertAdjacentHTML('beforeend', '<span>강사 비밀번호 <input id="pw" type="password" autocomplete="off"> <button id="pwb" type="button">로그인</button> <b id="pwm"></b></span>');
    document.getElementById('pwb').onclick = function () { HubSession.adminLogin(document.getElementById('pw').value).then(function (r) { document.getElementById('pwm').textContent = r.ok ? '로그인됨' : (r.error || '실패'); document.getElementById('pw').value = ''; if (r.ok) { HubQnaAdmin.unmount(); HubQnaAdmin.mount(document.getElementById('adm'), { session: HubSession, onPending: pendTxt }); } }); };
  }
}
run();
if (Q.has('unmount')) setTimeout(function () { HubQna.unmount(); HubQnaAdmin.unmount(); cols.innerHTML = '<p style="padding:20px">unmount 됨 — 1초 뒤 다시 mount</p>'; setTimeout(function () { cols.innerHTML = ''; run(); }, 1000); }, 1500);
</script>
</body>
</html>
