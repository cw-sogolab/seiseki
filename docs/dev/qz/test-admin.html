<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>[개발판] 퀴즈 강사 화면 시험</title>
<!-- 허브 없이 퀴즈 강사 화면만 확인하는 시험 페이지: 가짜 HubSession(isAdmin=true) + 가짜 quizStats 응답(가상 학생). ?err=login|net · ?empty=1 -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../assets/app.css">
<link rel="stylesheet" href="quiz.css?t=3">
<style>
html,body{height:100%}
body.hub{margin:0;display:flex;flex-direction:column;height:100dvh;background:var(--bg);color:var(--ink);font-family:var(--f-body)}
.hub-body{flex:1;min-height:0;position:relative}
.hub-pane{position:absolute;inset:0;overflow:auto;-webkit-overflow-scrolling:touch}
</style></head>
<body class="hub">
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs></defs></svg>
<main class="hub-body"><section class="hub-pane qz" id="p-b">
  <div hidden><a id="logo"></a><a id="toGrades"></a><nav class="nav"><button id="nav-student"></button><button id="nav-teacher"></button></nav></div>
  <main id="app" aria-live="polite"></main>
</section></main>
<script src="../assets/mascots.js"></script>
<script>HubMascots.mount({ skip: ['m-note', 'm-quiz', 'm-star'] });</script>
<script>
if(location.hash!=="#teacher") location.hash="#teacher";
var P=new URLSearchParams(location.search);
if(!P.get("nohub")){ window.HUB=1; window.HUB_ENV="dev"; }   // ?nohub=1 : 허브 밖(옛 단독 페이지)처럼 — PIN 화면이 나와야 함
window.__calls=[];
if(!P.get("nohub")) window.HubSession={ isAdmin:function(){return true;}, adminCall:function(a,p){ window.__calls.push(a);
  return new Promise(function(res){ setTimeout(function(){
    if(P.get("err")==="login") return res({ok:false,error:"관리자 로그인이 필요해요.",needLogin:true});
    if(P.get("err")==="net") return res({ok:false,error:"인터넷 연결을 확인해 주세요."});
    res(fake()); }, 400); }); } };
function fake(){
  var head=["타임스탬프","이름","반","범위","첫 시도 정답","걸린 시간(초)","틀린 문항","시도 횟수"];
  if(P.get("empty")) return {ok:true,head:head,rows:[],at:new Date().toISOString()};
  var names=["가상 하나","가상 둘","가상 셋","가상 넷","가상 다섯","가상 여섯","가상 일곱","가상 여덟"], cls=["화목반","토일반","개념반","단풀반"];
  var sets=["일본 지리 · 토도부현","세계 지리 · 나라 위치","개념 · 정치","개념 · 경제","통합본 · 일본 전체 통합","연습 · 일본 지리 · 토도부현"];
  var wr=["P01 홋카이도","P13 도쿄도","P27 오사카부","P40 후쿠오카현","P22 시즈오카현","P33 오카야마현"];
  var rows=[], r=7, rnd=function(){ r=(r*9301+49297)%233280; return r/233280; };
  for(var i=0;i<90;i++){ var n=names[i%names.length], s=sets[Math.floor(rnd()*sets.length)], q=[10,20][Math.floor(rnd()*2)], f=Math.max(2,Math.round(q*(0.45+rnd()*0.55)));
    var w=[]; for(var k=0;k<q-f && k<4;k++) w.push(wr[Math.floor(rnd()*wr.length)]);
    var d=new Date(Date.now()-Math.floor(rnd()*40)*864e5-Math.floor(rnd()*3e7));
    var prac=/^연습/.test(s);
    rows.push([d.toISOString().slice(0,19)+"+09:00", n, prac?"연습":cls[i%4], s, f+"/"+q, 60+Math.floor(rnd()*400), Array.from(new Set(w)).join(", "), 1+Math.floor(rnd()*3)]); }
  return {ok:true,head:head,rows:rows,at:new Date().toISOString()};
}
</script>
<script src="data.js"></script>
<script src="quiz.js?t=3"></script>
</body></html>
