<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>허브 캐릭터 미리보기</title>
<style>
:root{--bg:#F5F3FF;--card:#fff;--ink:#1E1B3A;--mute:#7A7699;--line:#E4E0FF;--accent:#5B4BF0}
:root[data-theme=dark]{--bg:#14122B;--card:#1F1C3F;--ink:#F1EFFF;--mute:#A09BC8;--line:#322E63;--accent:#A89CFF}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Pretendard,-apple-system,"Apple SD Gothic Neo",system-ui,sans-serif;transition:background .2s}
main{max-width:1180px;margin:0 auto;padding:20px 16px 64px}
h1{font-size:22px;margin:4px 0 2px}
h2{font-size:16px;margin:34px 0 10px;color:var(--accent)}
p.sub{margin:0 0 14px;color:var(--mute);font-size:13px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);padding:10px 0;border-bottom:1px solid var(--line)}
.bar button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer}
.bar button[aria-pressed=true]{background:#5B4BF0;color:#fff;border-color:#5B4BF0}
.bar .gap{width:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px 14px 12px}
.card h3{margin:0;font-size:14px}
.card .use{margin:2px 0 10px;font-size:12px;color:var(--mute);min-height:34px}
.row{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap}
.v{display:flex;flex-direction:column;align-items:center;gap:4px}
.v code{font-size:10.5px;color:var(--mute);word-break:break-all;text-align:center;max-width:110px}
.v small{font-size:11px;color:var(--accent);font-weight:600}
.big{display:flex;gap:6px;align-items:flex-end;margin-bottom:8px}
.sizes{display:flex;align-items:flex-end;gap:12px;margin-top:10px;padding-top:8px;border-top:1px dashed var(--line)}
.strip{display:flex;flex-wrap:wrap;gap:6px;padding:12px;border-radius:18px;align-items:center}
.strip.l{background:#F5F3FF}.strip.d{background:#14122B}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:700px){.two{grid-template-columns:1fr}}
.ex-note{font-size:12px;color:var(--mute)}
body.noanim .hm{animation:none!important}
</style>
</head>
<body>
<main>
  <div class="bar">
    <strong>허브 캐릭터</strong>
    <span class="gap"></span>
    <button id="bTheme" aria-pressed="false">다크 배경</button>
    <button id="bFloat" aria-pressed="true">떠오르기</button>
    <button id="bBounce" aria-pressed="false">통통</button>
    <button id="bBlink" aria-pressed="true">깜빡임</button>
    <button id="bWig" aria-pressed="false">흔들</button>
    <span class="ex-note" id="mot"></span>
  </div>
  <h1>3D 느낌 캐릭터 세트</h1>
  <p class="sub">assets/mascots.js — <code>HubMascots.mount()</code> 후 <code>&lt;svg&gt;&lt;use href="#m-…"/&gt;&lt;/svg&gt;</code>. 아래 id 를 그대로 쓰면 됨.</p>

  <h2>작은 크기 점검 (24px / 32px) — 라이트·다크 동시</h2>
  <div class="two">
    <div class="strip l" id="smallL"></div>
    <div class="strip d" id="smallD"></div>
  </div>

  <h2>감정 변형 · 주인공 (기본·기쁨·놀람·슬픔)</h2>
  <div class="grid" id="heroes"></div>

  <h2>전체 캐릭터</h2>
  <div class="grid" id="all"></div>
</main>
<script src="mascots.js"></script>
<script>
HubMascots.mount();
var M = HubMascots, root = document.documentElement;
var motion = {float:true, bounce:false, blink:true, wiggle:false};
function cls(){ return ['float','bounce','blink','wiggle'].filter(function(k){return motion[k]}).map(function(k){return 'hm-'+k}).join(' '); }
function card(c, big){
  var h = '<div class="card"><h3>'+c.name+'</h3><div class="use">'+c.use+'</div><div class="row">';
  c.ids.forEach(function(id,i){
    h += '<div class="v"><div class="vb" data-id="'+id+'" data-size="'+(big||96)+'"></div><small>'+c.exprName[i]+'</small><code>'+id+'</code></div>';
  });
  h += '</div><div class="sizes">';
  [24,32,48].forEach(function(z){ h += '<span class="vb" data-id="'+c.ids[0]+'" data-size="'+z+'" data-static="1"></span>'; });
  h += '<span class="vb" data-id="'+c.ids[0]+'" data-size="160" data-static="1" style="margin-left:auto"></span></div></div>';
  return h;
}
var heroes = M.chars.filter(function(c){return c.key==='note'||c.key==='quiz'});
document.getElementById('heroes').innerHTML = heroes.map(function(c){return card(c,92)}).join('');
document.getElementById('all').innerHTML = M.chars.filter(function(c){return heroes.indexOf(c)<0}).map(function(c){return card(c,92)}).join('');
/* 작은 크기 줄 */
var small = '';
M.chars.forEach(function(c){ small += M.svg(c.id,24)+M.svg(c.id,32); });
document.getElementById('smallL').innerHTML = small;
document.getElementById('smallD').innerHTML = small;

function render(){
  document.querySelectorAll('.vb').forEach(function(el){
    var st = el.getAttribute('data-static');
    el.innerHTML = M.svg(el.getAttribute('data-id'), +el.getAttribute('data-size'), st ? '' : cls());
    el.style.display = 'inline-block';
  });
  var rm = matchMedia('(prefers-reduced-motion: reduce)').matches;
  document.getElementById('mot').textContent = rm ? '· 시스템이 「동작 줄이기」 — 애니메이션 꺼짐' : '';
}
render();
function tog(btn,key){
  var b = document.getElementById(btn);
  b.onclick = function(){ motion[key] = !motion[key]; b.setAttribute('aria-pressed',motion[key]); render(); };
  b.setAttribute('aria-pressed',motion[key]);
}
tog('bFloat','float'); tog('bBounce','bounce'); tog('bBlink','blink'); tog('bWig','wiggle');
var bt = document.getElementById('bTheme');
bt.onclick = function(){ var d = root.dataset.theme==='dark'; root.dataset.theme = d?'light':'dark'; bt.setAttribute('aria-pressed', !d); };
</script>
</body>
</html>
