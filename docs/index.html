<body>
<div id="demo" class="demo" hidden>미리보기 모드예요. 예시 번호 KM482919로 들어가 보세요. 실제 성적이 아니고, 사진도 저장되지 않아요.</div>
<header class="appbar"><div class="wrap col">
  <span class="brand"><img src="assets/favicon.svg" alt="" width="26" height="26">성적노트</span>
  <div class="acts" id="acts" hidden><button id="refresh" class="linkbtn" type="button">새로고침</button><button id="out" class="linkbtn" type="button">나가기</button></div>
</div></header>

<main class="wrap col">
  <section id="login" class="login">
    <h1 class="title">선생님께 받은<br>내 번호를 입력해 주세요</h1>
    <p class="sub">퇴실퀴즈에 쓰는 번호와 같아요</p>
    <label for="sid" class="sr">내 번호</label>
    <input id="sid" type="text" class="idin" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="10" placeholder="KM482919" aria-describedby="loginMsg">
    <label class="check"><input id="remember" type="checkbox"> 이 기기에서 번호 기억하기 (내 폰일 때만)</label>
    <p id="loginMsg" class="msg err" role="alert"></p>
    <button id="go" class="btn block" type="button">조회하기</button>
    <p class="meta">영문 2자 + 숫자 6자리예요. 대소문자와 띄어쓰기는 상관없어요.<br>번호를 잊었으면 선생님께 말씀해 주세요.</p>
  </section>

  <section id="app" hidden>
    <h1 class="title"><span id="nm"></span>님의 성적</h1>
    <p class="sub" id="idshow" style="font-family:var(--f-mono)"></p>
    <div id="tabs" class="tabsrow" role="tablist" aria-label="내 반"></div>
    <div id="months" class="tabsrow months" aria-label="달"></div>
    <div id="panel"></div>
  </section>
</main>
